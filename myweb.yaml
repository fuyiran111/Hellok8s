apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: ClusterIP
  selector:
  app: nginx
  ports:
  - protocol: TCP
    port: 8090        # Service 对外暴露的端口（供集群内部或 port-forward 使用）
    targetPort: 80    # Pod 内部 Nginx 真正监听的端口
